</div></div></div>`}

function spM(id){const ms=inSt(id);mo(`<div class="fx sb" style="margin-bottom:8px"><h3>Storylines with this work</h3><span class="cu" onclick="closeM()">${ic('x')}</span></div><div class="dim xs" style="margin-bottom:8px">“${W[id].t}” appears in ${ms.length} storylines.</div>${ms.map(m=>`<div class="fx fn cu" style="padding:8px;border-radius:6px;background:var(--pp);margin-bottom:6px" onclick="closeM();go('story/${m.k}/${m.p}')">${tn(ST[m.k].cv,48)}<div class="f1"><b class="b6">${ST[m.k].t}</b><div class="dim xs">Chapter ${m.p} of ${ST[m.k].ch.length} · ${uc(m.k).length} creators</div></div>${ic('r')}</div>`).join('')}`)}
function conM(k){mo(`<div class="fx sb" style="margin-bottom:8px"><h3>Contributors · ${ST[k].t}</h3><span class="cu" onclick="closeM()">${ic('x')}</span></div><div style="max-height:60vh;overflow:auto">${uc(k).map(u=>`<div class="fx fn" style="padding:6px 0;border-top:1px solid var(--bd)">${A(u[0])}<b class="b6 f1">${u[0]}</b><span class="dim xs">${u[1]} chapter${u[1]>1?'s':''}</span></div>`).join('')}</div>`)}
function addM(wid,k){pickW=wid||pickW;k=k||'moon';const mine=['v1','v3','p2','q1'];mo(`<div class="fx sb" style="margin-bottom:10px"><h3>Add to Storyline</h3><span class="cu" onclick="closeM()">${ic('x')}</span></div>
${wid?`<div class="fx fn" style="margin-bottom:10px">${tn(wid,52)}<div><b class="b6">${W[wid].t}</b><div class="dim xs">${W[wid].ty} · @${W[wid].u}</div></div></div>`:`<div class="f"><label>Pick one of your works</label><div class="pk">${mine.map(i=>`<div class="${pickW==i?'on':''}" onclick="pickW='${i}';addM(null,document.getElementById('as').value)">${tn(i,'100%')}</div>`).join('')}</div></div>`}
<div class="f"><label>Storyline</label><select class="in" id="as" onchange="addM(${wid?`'${wid}'`:'null'},this.value)">${Object.keys(ST).map(x=>`<option value="${x}" ${x==k?'selected':''}>${ST[x].t}</option>`).join('')}</select></div>
<div class="f"><label>Follows which chapter? (1–${ST[k].ch.length})</label><input class="in" id="af" type="number" min="1" max="${ST[k].ch.length}" value="${ST[k].ch.length}" oninput="afl()"><div class="dim xs" id="ad"></div></div>
<div class="f"><label>Relation</label><div class="fx" id="ar">${['Continues','Responds to','Inspired by','Alternate','Side story'].map((x,i)=>`<span class="bg ${i?'n':''} cu" onclick="document.querySelectorAll('#ar .bg').forEach(e=>e.classList.add('n'));this.classList.remove('n')">${x}</span>`).join('')}</div></div>
<div class="f"><label>What happens here? (140 chars)</label><input class="in" id="an" value="The cat tells his side of the story."></div><div class="nt" id="ac"></div>
<div class="fx sb" style="margin-top:12px"><span class="dim xs">Free to submit · Suggested → Accepted / Declined</span><button class="b p" onclick="adS('${k}')">Submit</button></div>`);afl()}
function afl(){const k=as.value,i=Math.max(1,Math.min(ST[k].ch.length,+af.value||1)),w=W[ST[k].ch[i-1]?.w];ad.textContent=w?`#${i} · ${w.t} · @${w.u}`:'';ac.innerHTML=!w||w.u==ME?'You own this chapter – your work is added <b>immediately</b>.':`Chapter ${i} belongs to <b>@${w.u}</b>. They confirm in their <b>Storylines queue</b>; until then it shows as <b>Suggested</b>. A remix badge is never implied.`}
function adS(k){const i=+af.value,w=W[ST[k].ch[i-1]?.w],id=pickW||'v4',own=!w||w.u==ME;closeM();if(own){ST[k].ch.splice(i,0,{w:id,r:'Continues',s:an.value});toast(`Added as chapter ${i+1} of ${ST[k].t}`,`story/${k}/${i+1}`)}else toast(`Suggested to @${w.u} – waiting for approval`)}
function tipM(k){const us=uc(k),sm=us.slice(0,5),rest=us.length-sm.length;mo(`<div class="fx sb" style="margin-bottom:6px"><h3>Tip “${ST[k].t}”</h3><span class="cu" onclick="closeM()">${ic('x')}</span></div><div class="dim xs" style="margin-bottom:8px">Phase 3 · separate finance review. Split is frozen on confirm.</div>
<div class="fx" style="margin-bottom:10px"><input class="in" id="amt" type="number" value="100" min="1" style="width:100px" oninput="split()"><span class="bg y">${ic('bolt',12)} Yellow Buzz</span>${[50,100,500].map(x=>`<button class="b s" onclick="amt.value=${x};split()">${x}</button>`).join('')}<button class="b s" onclick="eq()">Equal</button></div>
<div id="sl">${sm.map(u=>`<div class="rrw">${tn(ST[k].ch.find(c=>W[c.w].u==u[0]).w,44)}<div><b class="b6">@${u[0]}</b><input type="range" min="0" max="10" value="${rest?1:u[1]}" oninput="split()"></div><div style="text-align:right"><b class="bz"></b><div class="dim xs"></div></div></div>`).join('')}${rest?`<div class="dim xs" style="margin-bottom:8px">+ ${rest} more creators share the remaining weight equally (shown in the full dialog).</div>`:''}</div>
<div class="fx sb"><span id="sum" class="dim"></span><button class="b p" id="send" onclick="closeM();toast('Demo only – no Buzz moved')">Send</button></div>`);split()}
function eq(){document.querySelectorAll('#sl input').forEach(x=>x.value=1);split()}
function split(){const w=[...document.querySelectorAll('#sl input')].map(x=>+x.value),a=Math.max(0,Math.floor(+amt.value||0)),T_=w.reduce((x,y)=>x+y,0);const s=w.map(x=>T_?a*x/T_:0),f=s.map(Math.floor),r=T_?a-f.reduce((x,y)=>x+y,0):0;s.map((x,i)=>[x-f[i],i]).sort((x,y)=>y[0]-x[0]).slice(0,r).forEach(p=>f[p[1]]++);document.querySelectorAll('#sl .bz').forEach((e,i)=>{e.textContent='⚡ '+f[i];e.nextElementSibling.textContent=(T_?Math.round(w[i]/T_*100):0)+'%'});const t=f.reduce((x,y)=>x+y,0);sum.textContent='Σ '+t+' / '+a+(t==a&&a?' ✓':'');send.textContent='Send ⚡ '+a}
const mo=h=>{m.innerHTML=`<div class="mo" onclick="if(event.target==this)closeM()"><div class="md">${h}</div></div>`},closeM=()=>m.innerHTML='';
function toast(t,l){tt.innerHTML=`<div class="toast">${t}${l?` <a class="cu" onclick="go('${l}')">View</a>`:''}</div>`;clearTimeout(toast.h);toast.h=setTimeout(()=>tt.innerHTML='',4500)}
function pm(e,id){e.stopPropagation();const o=document.getElementById(id),was=o.classList.contains('on');document.querySelectorAll('.pm.on').forEach(x=>x.classList.remove('on'));if(!was)o.classList.add('on')}
document.addEventListener('click',()=>document.querySelectorAll('.pm.on').forEach(x=>x.classList.remove('on')));
function go(h){if(location.hash.slice(1)==h)render();else location.hash=h}
function render(){const [a,b,c]=(location.hash.slice(1)||'feed').split('/');closeM();mk.querySelectorAll('button[data-h]').forEach(x=>x.classList.toggle('on',location.hash.slice(1).startsWith(x.dataset.h)));st.innerHTML=a=='story'?T.story(b,c):a=='work'?T.work(b,c):T[a]();if(a=='story'&&SV.sc){SV.sc=0;const e=document.getElementById('ch-'+SV.cur);e?e.scrollIntoView({block:'center'}):0}else if(a!='story')window.scrollTo(0,0)}
addEventListener('hashchange',render);
const QJ=[['feed','Feed'],['work/p3/feed','Work'],['story/patch','Storyline'],['story/halloween','100+ chapters'],['disc','Discovery'],['queue','Queue']];
mk.innerHTML='<i>Demo flow:</i>'+QJ.map(x=>`<button data-h="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+'<span class="sp"></span><button onclick="st.classList.toggle(\'mb\');this.classList.toggle(\'on\')">390px</button><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==\'dark\'?\'light\':\'dark\'">Theme</button><button onclick="location.reload()">Reset</button>';
render();
</script></body></html>
